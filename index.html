<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moukhless Games</title>
<meta name="description" content="Target Drop, a casual tapping game for Android by Abdellah Moukhless.">
<style>
  :root { --bg: #fff7fb; --card: #ffffff; --text: #2b2140; --muted: #6b5f80; --accent: #e8457a; --line: #f0dbe6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17121f; --card: #211a2c; --text: #f3eefa; --muted: #b6a9c9; --accent: #ff7aa5; --line: #3a2f4a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  .muted { color: var(--muted); margin-top: 0; }
  .game { display: flex; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--line);
          border-radius: 18px; padding: 16px; margin-top: 24px; }
  .game img { width: 88px; height: 88px; border-radius: 20px; flex: none; }
  .game h2 { margin: 0 0 4px; font-size: 1.25rem; }
  .game p { margin: 0 0 8px; }
  a { color: var(--accent); }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Moukhless Games</h1>
  <p class="muted">Independent mobile games by Abdellah Moukhless.</p>

  <div class="game">
    <img src="icon.png" alt="Target Drop icon">
    <div>
      <h2>Target Drop</h2>
      <p>Tap the target, avoid the rest! A fast, colourful tapping game for Android.</p>
      <a href="privacy-policy.html">Privacy Policy</a>
    </div>
  </div>

  <footer>Contact: <a href="mailto:mistermoukhless03@gmail.com">mistermoukhless03@gmail.com</a></footer>
</main>
</body>
</html>
